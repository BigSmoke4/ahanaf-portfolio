<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ocean · world map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0b1f2b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .ocean-backdrop {
      --ocean-deep: #0b3a57;
      --ocean: #0f4e72;
      --shallow: #3ec8cfb1;
      --foam: #ffffffa3;
      --sand: #f6e7b4;
      --dune: #ecd899;
      --land: #93c66b;
      --land-dark: #79ab4f;

      position: relative;
      width: 100%;
      max-width: 1600px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px #ffffff1a;
      background: linear-gradient(180deg, #216a94 75%, #194f71 100%);
    }

    #map { display: block; width: 100%; height: auto; }

    /* country hit/hover layer */
    .country {
      stroke: #3f6f2c;
      stroke-opacity: 0.55;
      stroke-width: 0.5;
      stroke-linejoin: round;
      cursor: pointer;
      transition: fill 0.12s ease;
    }
    .country:hover, .country.active {
      fill: #ffffff;
      fill-opacity: 0.38;
      stroke: #ffffff;
      stroke-opacity: 0.95;
      stroke-width: 1.2;
    }

    #tooltip {
      position: fixed;
      left: 0; top: 0;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -140%);
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(8, 28, 41, 0.92);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 0 0 1px #ffffff22;
      transition: opacity 0.1s ease;
      z-index: 10;
    }
    #tooltip.show { opacity: 1; }

    #status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffffcc;
      font-size: 15px;
      text-align: center;
      padding: 2rem;
      pointer-events: none;
    }

    /* ===== Ahanaf avatar ===== */
    .face {
      position: relative;
      width: 300px;
      height: 350px;
      background-color: #6C757D;
      background: linear-gradient(180deg,#452824 184px,#f2bbad 34px);
      border-top-right-radius: 250px 350px;
      border-top-left-radius: 250px 350px;
      border-bottom-left-radius: 250px 250px;
      border-bottom-right-radius: 250px 250px;
      border: 5px solid black;
    }
    .hairs {
      height: 180px;
      background-color: #f2bbad;
      position: absolute;
      width: 290px;
      border-top-right-radius: 250px 350px;
      border-top-left-radius: 250px 350px;
      top: 25px;
    }
    .snow { transform: translateX(150px); transform-origin: right; }
    .mountain-cap-1, .mountain-cap-2, .mountain-cap-3, .mountain-cap-4 {
      position: absolute;
      top: 20px;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 40px solid #452824;
    }
    .mountain-cap-1 { left: -65px; }
    .mountain-cap-2 { left: -35px; }
    .mountain-cap-3 { left: -5px; }
    .mountain-cap-4 { left: 25px; }
    .earL {
      border-top-right-radius: 250px 350px;
      border-top-left-radius: 250px 350px;
      border-bottom-left-radius: 250px 250px;
      border-bottom-right-radius: 250px 250px;
      height: 70px; width: 50px;
      background-color: #f2bbad;
      position: absolute;
      left: -30px; top: 150px;
      z-index: -1;
      border: 5px solid black;
    }
    .earR {
      border-top-right-radius: 250px 350px;
      border-top-left-radius: 250px 350px;
      border-bottom-left-radius: 250px 250px;
      border-bottom-right-radius: 250px 250px;
      height: 70px; width: 50px;
      background-color: #f2bbad;
      position: absolute;
      right: -30px; top: 150px;
      z-index: -4;
      border: 5px solid black;
    }
    .eyeR {
      border-top-right-radius: 250px 350px;
      border-top-left-radius: 250px 350px;
      border-bottom-left-radius: 250px 250px;
      border-bottom-right-radius: 250px 250px;
      height: 10px; width: 10px;
      background-color: black;
      position: absolute;
      left: 128px; top: 120px;
      z-index: 2;
      animation: blinkR 5s infinite linear;
    }
    .eyeL {
      border-top-right-radius: 250px 350px;
      border-top-left-radius: 250px 350px;
      border-bottom-left-radius: 250px 250px;
      border-bottom-right-radius: 250px 250px;
      height: 10px; width: 10px;
      background-color: black;
      position: absolute;
      right: 128px; top: 120px;
      z-index: 2;
      animation: blinkL 5s infinite linear;
    }
    .nose {
      background: #fefefe;
      width: 20px; height: 20px;
      border-radius: 50%;
      color: #0F0;
      position: absolute;
      top: 220px; left: 140px;
      scale: 1 1;
      transition: all ease-in-out .3s;
      z-index: 100;
    }
    .nose:hover { scale: 1 1.25; top: 236px; }
    .nose:active {
      animation: propeller .5s infinite linear;
      transform-origin: 50% -55px;
      scale: 1 1.25;
      top: 220px;
      animation-delay: .5s;
    }
    @keyframes propeller { to { transform: rotateZ(360deg); } }
    @keyframes blinkL {
      98%  { height: 10px; width: 10px; right: 128px; top: 120px; }
      100% { height: 3px;  width: 11px; right: 126px; top: 123px; }
    }
    @keyframes blinkR {
      98%  { height: 10px; width: 10px; left: 128px; top: 120px; }
      100% { height: 3px;  width: 11px; left: 126px; top: 123px; }
    }
    .nose:before {
      content: "";
      position: absolute;
      top: -64px; left: 50%;
      border: 10px solid transparent;
      border-bottom: 62px solid #fefefe;
      transform: translateX(-50%);
    }
    .mouth {
      position: absolute;
      top: 300px; left: 140px;
      background: #a36655;
      width: 25px; height: 18px;
      border: 5px solid black;
      border-radius: 50%;
      transition: all .3s linear;
    }
    .face:active .mouth {
      top: 290px; width: 60px; height: 25px; left: 123px;
      border-radius: 7px 7px 130px 130px;
    }
    .face:active .smileL { height: 30px; width: 30px; }
    .face:active .smileR { height: 30px; width: 30px; }
    .bo { z-index: 10; }
    .smileL {
      position: absolute; height: 0px; width: 0px;
      rotate: 310deg; top: 180px; left: 70px;
      transition: all .1s linear;
    }
    .smileR {
      position: absolute; height: 0px; width: 0px;
      rotate: 310deg; top: 180px; right: 70px;
      transition: all .1s linear;
    }

    /* pin that places the avatar on the map; --s is set from JS so it scales with the map */
    .pin { position: absolute; width: 0; height: 0; z-index: 5; }
    .pin .avatar-scale {
      position: absolute; left: -150px; top: -175px; width: 300px; height: 350px;
      transform: scale(var(--s, 0.27)); transform-origin: 50% 50%;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.35));
    }
    .pin .tag {
      position: absolute; left: 0;
      top: calc(175px * var(--s, 0.27) + 8px);
      transform: translateX(-50%);
      text-align: center; white-space: nowrap; pointer-events: none;
      padding: 5px 13px 6px; border-radius: 14px;
      background: rgba(8, 28, 41, 0.92); color: #fff;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 0 0 1px #ffffff22;
    }
    .pin .tag b { display: block; font-size: clamp(11px, calc(var(--s, 0.27) * 52px), 16px); letter-spacing: .02em; }
    .pin .tag span {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: clamp(9px, calc(var(--s, 0.27) * 40px), 12.5px); opacity: .88;
    }
    .pin .flag {
      width: 14px; height: 9px; border-radius: 2px; background: #006a4e; position: relative; flex: none;
    }
    .pin .flag::after {
      content: ""; position: absolute; left: 4px; top: 1.5px; width: 6px; height: 6px;
      border-radius: 50%; background: #f42a41;
    }
  </style>
</head>
<body>

  <div class="ocean-backdrop" id="stage">
    <svg id="map" viewBox="0 0 1600 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="World map">
      <defs>
        <!-- same hand-drawn wobble as the original, tuned for map scale; applied to the coastal rings only -->
        <filter id="handDrawnNoise" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1800" height="1100">
          <feTurbulence result="noise" numOctaves="4" baseFrequency="0.018" type="fractalNoise"></feTurbulence>
          <feDisplacementMap yChannelSelector="G" xChannelSelector="R" scale="9" in2="noise" in="SourceGraphic"></feDisplacementMap>
        </filter>
        <clipPath id="landClip"><path id="clipLand"></path></clipPath>

        <!-- anime-style wave marks that drift across the open sea -->
        <pattern id="waveMarksA" width="140" height="64" patternUnits="userSpaceOnUse">
          <path d="M14 20 q10 -9 20 0 t20 0 t20 0" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M84 50 q8 -7 16 0 t16 0" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round"/>
        </pattern>
        <pattern id="waveMarksB" width="190" height="88" patternUnits="userSpaceOnUse">
          <path d="M40 30 q9 -8 18 0 t18 0" fill="none" stroke="#bff3f6" stroke-opacity="0.16" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M120 70 q12 -10 24 0 t24 0 t24 0" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round"/>
        </pattern>
      </defs>

      <!-- 0. open-sea shimmer: two layers of wave marks drifting at different speeds -->
      <g id="seaMarks" pointer-events="none">
        <rect x="-140" y="-64" width="1900" height="1000" fill="url(#waveMarksA)">
          <animate attributeName="opacity" values="0.35;1;0.35" dur="9s" repeatCount="indefinite"/>
        </rect>
        <rect x="-190" y="-88" width="2000" height="1100" fill="url(#waveMarksB)">
          <animate attributeName="opacity" values="1;0.3;1" dur="13s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- 1. shallow → foam → sand → dune rings, grown outward from the exact coastline; they breathe like surf -->
      <g id="rings" filter="url(#handDrawnNoise)" fill-rule="nonzero" stroke-linejoin="round" stroke-linecap="round" pointer-events="none">
        <path id="ringShallow" fill="var(--shallow)" stroke="var(--shallow)">
          <animate attributeName="stroke-width" values="34;40;34" dur="7s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        </path>
        <path id="ringFoam" fill="var(--foam)" stroke="var(--foam)">
          <animate attributeName="stroke-width" values="20;27;20" dur="7s" begin="-0.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        </path>
        <path id="ringSand" fill="var(--sand)" stroke="var(--sand)">
          <animate attributeName="stroke-width" values="16;12;16" dur="7s" begin="-1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        </path>
        <path id="ringDune" fill="var(--dune)" stroke="var(--dune)">
          <animate attributeName="stroke-width" values="8;7;8" dur="7s" begin="-1.2s" repeatCount="indefinite"/>
        </path>

        <!-- surf waves are generated in JS: each one rises offshore, rolls in, breaks and washes up -->
        <g id="crests" fill="none"></g>
      </g>

      <!-- 2. land: dark core, lighter edge (only the inner half of the edge stroke is visible) -->
      <g clip-path="url(#landClip)">
        <path id="landFill" fill="var(--land-dark)" stroke="var(--land)" stroke-width="14" stroke-linejoin="round"></path>
      </g>

      <!-- ships sailing the open sea (filled in by JS) -->
      <g id="ships" pointer-events="none"></g>

      <!-- 3. every country, pixel-exact; carries borders, tint and hover -->
      <g id="countries"></g>

      <!-- arrow + marker pointing at Bangladesh (filled in by JS) -->
      <g id="pin" pointer-events="none"></g>
    </svg>

    <div id="status">Loading world map data…</div>
  </div>

  <div id="tooltip" role="tooltip"></div>

  <template id="avatarTpl">
    <div class="pin">
      <div class="avatar-scale">
        <div class="bo">
          <div class="face">
            <div class="earL"></div>
            <div class="earR"></div>
            <div class="eyeL"></div>
            <div class="eyeR"></div>
            <div class="hairs"></div>
            <div class="nose"></div>
            <div class="mouth"></div>
            <div class="smileL">
              <svg xml:space="preserve" viewBox="0 0 65 65" xmlns="http://www.w3.org/2000/svg">
                <filter id="blurMe"><feGaussianBlur in="SourceGraphic" stdDeviation="2"></feGaussianBlur></filter>
                <path d="M25 19c-6 2-12 4-18 5-2 0-4-2-6-3 1-1 2-3 3-4 11-3 22-7 32-10 2-1 4 1 6 2-1 1-2 4-3 4-4 2-9 4-14 6z" fill="#EF7F71" filter="url(#blurMe)"></path>
                <path d="M35 35c-6 2-12 4-18 5-2 0-4-2-6-3 1-1 2-3 3-4 11-3 22-7 32-10 2-1 4 1 6 2-1 1-2 4-3 4-4 2-9 4-14 6z" fill="#EF7F71" filter="url(#blurMe)"></path>
                <path d="M45 50c-6 2-12 4-18 5-2 0-4-2-6-3 1-1 2-3 3-4 11-3 22-7 32-10 2-1 4 1 6 2-1 1-2 4-3 4-4 2-9 4-14 6z" fill="#EF7F71" filter="url(#blurMe)"></path>
              </svg>
            </div>
            <div class="smileR">
              <svg xml:space="preserve" viewBox="0 0 65 65" xmlns="http://www.w3.org/2000/svg">
                <filter id="blurMe"><feGaussianBlur in="SourceGraphic" stdDeviation="2"></feGaussianBlur></filter>
                <path d="M25 19c-6 2-12 4-18 5-2 0-4-2-6-3 1-1 2-3 3-4 11-3 22-7 32-10 2-1 4 1 6 2-1 1-2 4-3 4-4 2-9 4-14 6z" fill="#EF7F71" filter="url(#blurMe)"></path>
                <path d="M35 35c-6 2-12 4-18 5-2 0-4-2-6-3 1-1 2-3 3-4 11-3 22-7 32-10 2-1 4 1 6 2-1 1-2 4-3 4-4 2-9 4-14 6z" fill="#EF7F71" filter="url(#blurMe)"></path>
                <path d="M45 50c-6 2-12 4-18 5-2 0-4-2-6-3 1-1 2-3 3-4 11-3 22-7 32-10 2-1 4 1 6 2-1 1-2 4-3 4-4 2-9 4-14 6z" fill="#EF7F71" filter="url(#blurMe)"></path>
              </svg>
            </div>
            <div class="snow">
              <div class="mountain-cap-1"></div>
              <div class="mountain-cap-2"></div>
              <div class="mountain-cap-3"></div>
              <div class="mountain-cap-4"></div>
              <div></div>
            </div>
          </div>
        </div>
      </div>
      <div class="tag"><b>Ahanaf</b><span><i class="flag"></i>Based in Bangladesh</span></div>
    </div>
  </template>


  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script>
  (function () {
    var W = 1600;
    var DATA_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json"; // Natural Earth 1:50m
    var status = document.getElementById("status");
    var tooltip = document.getElementById("tooltip");
    var svg = document.getElementById("map");

    function fail(msg) { status.textContent = msg; }

    if (!window.d3 || !window.topojson) { fail("Could not load d3 / topojson from the CDN. Check your connection and reload."); return; }

    fetch(DATA_URL)
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(draw)
      .catch(function (e) { fail("Could not load country data (" + e.message + "). Check your connection and reload."); });


    var NS = "http://www.w3.org/2000/svg";
    function mk(tag, attrs, parent) {
      var e = document.createElementNS(NS, tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    }
    function anim(parent, attr, values, keyTimes, splines, dur, begin) {
      mk("animate", {
        attributeName: attr, values: values.join(";"), keyTimes: keyTimes.join(";"),
        calcMode: "spline", keySplines: splines.join(";"),
        dur: dur + "s", begin: begin + "s", repeatCount: "indefinite"
      }, parent);
    }

    // Cartoon surf waves, one patch of coast at a time:
    //  0-8%    a wave suddenly appears out at sea: teal body, dark outline, white foam crest
    //  8-40%   it rolls toward the shore, picking up speed
    //  40-48%  it breaks: a solid white splash bursts up the beach
    //  48-60%  the foam slides back and fades
    //  60-100% calm sea, then the next wave appears somewhere else along the coast
    // Stroke widths are 2x the distance from the coast.
    function buildWaves(landD) {
      var defs = svg.querySelector("defs");
      var holder = document.getElementById("crests");

      var KT  = [0, 0.08, 0.40, 0.48, 0.60, 1];
      var SPL = ["0.2 0 0.4 1", "0.45 0 0.8 0.85", "0.15 0.7 0.35 1", "0.3 0 0.5 1", "0 0 1 1"];
      var OUT = [170, 156, 30, 46, 28, 28];   // front edge of the foam crest
      var IN  = [158, 138, 14,  0, 22, 22];   // back edge (0 = solid up to the shore)
      function off(arr, d)  { return arr.map(function (v) { return Math.max(0, v + 2 * d); }); }
      function pad(arr, d)  { return arr.map(function (v) { return Math.max(0, v - 2 * d); }); }
      var ENV = { kt: [0, 0.08, 0.46, 0.60, 1], v: [0, 1, 1, 0, 0] };
      var SPLASH = { kt: [0, 0.38, 0.44, 0.58, 0.66, 1], v: [0, 0, 1, 0.75, 0, 0] };

      // layers from the back of the wave to the front
      var layers = [
        { color: "#2f9fc4", op: 0.5,  inner: OUT,           outer: off(OUT, 21), dash: null },        // teal wave body
        { color: "#1b6f94", op: 0.85, inner: off(OUT, 20),  outer: off(OUT, 23), dash: "70 26" },     // back contour line
        { color: "#ffffff", op: 0.9,  inner: off(OUT, 8),   outer: off(OUT, 12), dash: "26 20" },     // trailing whitewater
        { color: "#1b7ea6", op: 1,    inner: pad(IN, 4),    outer: off(OUT, 2),  dash: null },        // dark outline of the crest
        { color: "#ffffff", op: 1,    inner: IN,            outer: OUT,          dash: "46 16" },      // foam crest (broken, cartoon-style)
        { color: "#ffffff", op: 1,    inner: IN,            outer: OUT,          dash: null, env: SPLASH } // solid splash when it breaks
      ];

      // soft round spotlight so a wave only exists in one patch of the coast
      var fade = mk("radialGradient", { id: "regionFade" }, defs);
      mk("stop", { offset: "0",    "stop-color": "#fff" }, fade);
      mk("stop", { offset: "0.55", "stop-color": "#fff" }, fade);
      mk("stop", { offset: "1",    "stop-color": "#000" }, fade);

      // random spots along the real coastline
      var probe = mk("path", { d: landD, fill: "none" });
      svg.appendChild(probe);
      var coastLen = probe.getTotalLength();
      function randomCoastPoint() {
        for (var tries = 0; tries < 20; tries++) {
          var p = probe.getPointAtLength(Math.random() * coastLen);
          if (p.x > 40 && p.x < 1560) return p;
        }
        return probe.getPointAtLength(coastLen / 2);
      }

      var waves = [ { dur: 14, begin: -2 }, { dur: 19, begin: -12 } ];

      waves.forEach(function (w, i) {
        var rmask = mk("mask", { id: "region" + i, maskUnits: "userSpaceOnUse", x: -100, y: -100, width: 1800, height: 1100 }, defs);
        var spot = mk("circle", { r: 230, fill: "url(#regionFade)" }, rmask);
        function move() { var p = randomCoastPoint(); spot.setAttribute("cx", p.x); spot.setAttribute("cy", p.y); }
        move();

        var g = mk("g", { mask: "url(#region" + i + ")" }, holder);

        layers.forEach(function (L, j) {
          var mask = mk("mask", { id: "wm" + i + "_" + j, maskUnits: "userSpaceOnUse", x: -100, y: -100, width: 1800, height: 1100 }, defs);
          var common = { d: landD, fill: "none", "stroke-linejoin": "round" };
          var white = mk("path", Object.assign({ stroke: "#fff", "stroke-width": L.outer[0] }, common), mask);
          if (L.dash) white.setAttribute("stroke-dasharray", L.dash);
          anim(white, "stroke-width", L.outer, KT, SPL, w.dur, w.begin);
          var cut = mk("path", Object.assign({ stroke: "#000", "stroke-width": L.inner[0] }, common), mask);
          anim(cut, "stroke-width", L.inner, KT, SPL, w.dur, w.begin);

          var rect = mk("rect", { x: -100, y: -100, width: 1800, height: 1100, fill: L.color, mask: "url(#wm" + i + "_" + j + ")", opacity: 0 }, g);
          var env = L.env || ENV;
          mk("animate", {
            attributeName: "opacity",
            values: env.v.map(function (v) { return v * L.op; }).join(";"),
            keyTimes: env.kt.join(";"), calcMode: "linear",
            dur: w.dur + "s", begin: w.begin + "s", repeatCount: "indefinite"
          }, rect);
        });

        // while the sea is calm (everything invisible), jump to a new patch of coast
        var moved = false;
        setInterval(function () {
          var phase = ((svg.getCurrentTime() - w.begin) / w.dur) % 1;
          if (phase > 0.75 && !moved) { move(); moved = true; }
          else if (phase < 0.5) moved = false;
        }, 400);
      });
    }

    // Little cartoon ships sailing slow routes across open water (positions given as lon/lat)
    function buildShips(projection) {
      var g = document.getElementById("ships");
      var routes = [
        { a: [-56, 36],   b: [-14, 41],  hull: "#d9534f", type: "cargo", dur: 70, begin: -10 },
        { a: [-128, 31],  b: [-176, 27], hull: "#2d6cdf", type: "cargo", dur: 85, begin: -40 },
        { a: [52, -24],   b: [88, -34],  hull: "#e8a229", type: "sail",  dur: 75, begin: -20 },
        { a: [4, -26],    b: [-28, -9],  hull: "#8e5bd9", type: "cargo", dur: 65, begin: -5 },
        { a: [6, 38],     b: [20, 35],   hull: "#c0392b", type: "sail",  dur: 45, begin: -15 },
        { a: [-134, -18], b: [-92, -31], hull: "#16a085", type: "cargo", dur: 80, begin: -50 },
        { a: [136, -43],  b: [96, -38],  hull: "#c0392b", type: "sail",  dur: 70, begin: -30 },
        { a: [150, 31],   b: [178, 37],  hull: "#2d6cdf", type: "cargo", dur: 60, begin: -25 }
      ];
      var INK = "#10303f";

      function shipArt(r) {
        var art = "";
        if (r.type === "cargo") {
          art += '<path d="M-19 0 L19 0 L14 9 L-15 9 Z" fill="' + r.hull + '" stroke="' + INK + '" stroke-width="1.2" stroke-linejoin="round"/>';
          art += '<rect x="-7" y="-6" width="7" height="6" fill="#f6c445" stroke="' + INK + '" stroke-width="1"/>';
          art += '<rect x="0"  y="-6" width="7" height="6" fill="#4aa3df" stroke="' + INK + '" stroke-width="1"/>';
          art += '<rect x="7"  y="-6" width="7" height="6" fill="#ececec" stroke="' + INK + '" stroke-width="1"/>';
          art += '<rect x="-17" y="-12" width="8" height="12" fill="#fff" stroke="' + INK + '" stroke-width="1.1"/>';
          art += '<rect x="-15.5" y="-9" width="2" height="2" fill="' + INK + '"/><rect x="-12.5" y="-9" width="2" height="2" fill="' + INK + '"/>';
          art += '<rect x="-15" y="-17" width="4" height="5" fill="' + r.hull + '" stroke="' + INK + '" stroke-width="1"/>';
        } else {
          art += '<path d="M-16 0 L16 0 L11 8 L-12 8 Z" fill="' + r.hull + '" stroke="' + INK + '" stroke-width="1.2" stroke-linejoin="round"/>';
          art += '<line x1="0" y1="-30" x2="0" y2="0" stroke="' + INK + '" stroke-width="1.4"/>';
          art += '<path d="M1.5 -29 L1.5 -3 L15 -3 Z" fill="#fff" stroke="' + INK + '" stroke-width="1" stroke-linejoin="round"/>';
          art += '<path d="M-1.5 -24 L-1.5 -3 L-12 -3 Z" fill="#fdf0c9" stroke="' + INK + '" stroke-width="1" stroke-linejoin="round"/>';
          art += '<path d="M0 -30 L7 -28 L0 -26 Z" fill="#e74c3c" stroke="' + INK + '" stroke-width="0.8"/>';
        }
        return art;
      }

      routes.forEach(function (r) {
        var p0 = projection(r.a), p1 = projection(r.b);
        var mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
        var dx = p1[0] - p0[0], dy = p1[1] - p0[1];
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var cx = mx - dy / len * len * 0.12, cy = my + dx / len * len * 0.12;   // gentle curve
        var d = "M" + p0[0].toFixed(1) + " " + p0[1].toFixed(1) +
                " Q" + cx.toFixed(1) + " " + cy.toFixed(1) + " " + p1[0].toFixed(1) + " " + p1[1].toFixed(1);
        var flip = dx < 0 ? -1 : 1;
        var t = 'dur="' + r.dur + 's" begin="' + r.begin + 's" repeatCount="indefinite"';

        var html =
          '<g opacity="0">' +
            '<animateMotion ' + t + ' path="' + d + '" calcMode="linear"/>' +
            '<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" ' + t + '/>' +
            '<g transform="scale(' + (flip * 0.9) + ',0.9)">' +
              '<g><animateTransform attributeName="transform" type="translate" values="0 -1.2;0 1.2;0 -1.2" dur="3.1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>' +
                '<g><animateTransform attributeName="transform" type="rotate" values="-2.5 0 6;2.5 0 6;-2.5 0 6" dur="3.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>' +
                  '<path d="M-18 8 q-12 3 -28 0" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="2.2" stroke-linecap="round"/>' +
                  '<path d="M-16 11 q-9 2 -20 0" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.8" stroke-linecap="round"/>' +
                  shipArt(r) +
                  '<ellipse cx="0" cy="9" rx="21" ry="2.6" fill="#fff" fill-opacity="0.7"/>' +
                '</g>' +
              '</g>' +
            '</g>' +
          '</g>';
        g.insertAdjacentHTML("beforeend", html);
      });
    }


    // Ahanaf's avatar floats in the Indian Ocean and points up at Bangladesh
    function buildAvatar(projection, W, H) {
      var stage = document.getElementById("stage");
      var S = 0.27;                                  // avatar size relative to a 1600px-wide map
      var bd = projection([90.3, 23.8]);             // Bangladesh
      var an = projection([86, -9]);                 // where the avatar sits (open water)

      // 1) the avatar itself (HTML, so its hover / click animations keep working)
      var pin = document.getElementById("avatarTpl").content.firstElementChild.cloneNode(true);
      pin.style.left = (an[0] / W * 100) + "%";
      pin.style.top  = (an[1] / H * 100) + "%";
      stage.appendChild(pin);
      function rescale() { stage.style.setProperty("--s", (stage.clientWidth / W * S).toFixed(4)); }
      rescale();
      window.addEventListener("resize", rescale);
      if (window.ResizeObserver) new ResizeObserver(rescale).observe(stage);

      // 2) dashed arrow from the avatar's head up to Bangladesh, plus a pulsing marker
      var x0 = an[0], y0 = an[1] - 175 * S - 4;
      var x1 = bd[0], y1 = bd[1] + 9;
      var d = "M" + x0.toFixed(1) + " " + y0.toFixed(1) +
              " Q" + ((x0 + x1) / 2 - 38).toFixed(1) + " " + ((y0 + y1) / 2).toFixed(1) +
              " " + x1.toFixed(1) + " " + y1.toFixed(1);
      document.getElementById("pin").innerHTML =
        '<defs><marker id="arrowHead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">' +
          '<path d="M0 0 L10 5 L0 10 Z" fill="#fff"/></marker></defs>' +
        '<path d="' + d + '" fill="none" stroke="#08202e" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>' +
        '<path d="' + d + '" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#arrowHead)">' +
          '<animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></path>' +
        '<circle cx="' + bd[0].toFixed(1) + '" cy="' + bd[1].toFixed(1) + '" r="4" fill="none" stroke="#ff4d6d" stroke-width="2">' +
          '<animate attributeName="r" values="4;16" dur="2s" repeatCount="indefinite"/>' +
          '<animate attributeName="stroke-opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/></circle>' +
        '<circle cx="' + bd[0].toFixed(1) + '" cy="' + bd[1].toFixed(1) + '" r="4.2" fill="#ff4d6d" stroke="#fff" stroke-width="1.6"/>';
    }

    function draw(topo) {
      var countries = topojson.feature(topo, topo.objects.countries).features;
      var land = topojson.merge(topo, topo.objects.countries.geometries);

      // fit the whole globe to the viewBox width, then size the viewBox height to match
      var projection = d3.geoNaturalEarth1();
      projection.fitWidth(W - 24, { type: "Sphere" }).translate(
        [projection.translate()[0] + 12, projection.translate()[1] + 12]
      );
      var path = d3.geoPath(projection);
      var b = path.bounds({ type: "Sphere" });
      var H = Math.ceil(b[1][1] + 12);
      svg.setAttribute("viewBox", "0 0 " + W + " " + H);

      var landD = path(land);
      document.getElementById("clipLand").setAttribute("d", landD);
      document.getElementById("landFill").setAttribute("d", landD);

      // ring widths are centred on the coast, so the visible band outside the coast is half of each value
      var rings = [
        ["ringShallow", 34],
        ["ringFoam",    22],
        ["ringSand",    14],
        ["ringDune",     8]
      ];
      rings.forEach(function (r) {
        var el = document.getElementById(r[0]);
        el.setAttribute("d", landD);
        el.setAttribute("stroke-width", r[1]);
      });

      // crest masks follow the same exact coastline
      buildWaves(landD);
      buildShips(projection);
      buildAvatar(projection, W, H);

      // respect reduced-motion settings: freeze the waves in a pleasant still frame
      if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches && svg.pauseAnimations) {
        svg.pauseAnimations();
      }

      // gentle per-country green variation, in the palette of the original design
      var tints = ["#93c66b", "#9bcf72", "#86b95e", "#a3c96f", "#8fc17a"];
      function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }

      var g = d3.select("#countries");
      g.selectAll("path")
        .data(countries)
        .join("path")
        .attr("class", "country")
        .attr("d", path)
        .attr("fill", function (d) { return tints[hash(String(d.properties.name || d.id)) % tints.length]; })
        .attr("fill-opacity", 0.55)
        .on("pointerenter pointermove", function (event, d) {
          var name = d.properties.name || "Unknown";
          tooltip.textContent = name;
          tooltip.style.left = event.clientX + "px";
          tooltip.style.top = event.clientY + "px";
          tooltip.classList.add("show");
        })
        .on("pointerleave", function () { tooltip.classList.remove("show"); });

      status.remove();
    }
  })();
  </script>
